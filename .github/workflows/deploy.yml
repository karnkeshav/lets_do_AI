# ─────────────────────────────────────────────────────────────────────────────
# Deploy — AI for EveryOne Workshop
#
# Triggers on every push to main (and can be run manually).
# Steps:
#   1. Checkout source
#   2. Inject GitHub repository secrets into config.js
#   3. Copy web assets to dist/
#   4. Deploy dist/ to GitHub Pages
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SHEET_URL   — Apps Script Web App URL
#   RAZORPAY_KEY_ID    — Razorpay publishable key
#   CSV_GITHUB_TOKEN   — Fine-grained PAT (Contents R+W on this repo)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Inject secrets → config.js ──────────────────────────────────────────
      # Python json.dumps guarantees proper escaping regardless of what
      # characters appear in the secret values.
      - name: Create config.js from repository secrets
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          RAZORPAY_KEY_ID:  ${{ secrets.RAZORPAY_KEY_ID }}
          CSV_GITHUB_TOKEN: ${{ secrets.CSV_GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json

          cfg = {
              "GOOGLE_SHEET_URL": os.environ.get("GOOGLE_SHEET_URL", ""),
              "RAZORPAY_KEY_ID":  os.environ.get("RAZORPAY_KEY_ID",  ""),
              "GITHUB_TOKEN":     os.environ.get("CSV_GITHUB_TOKEN", ""),
              "GITHUB_REPO":      "karnkeshav/lets_do_AI",
          }

          content = "/* Auto-generated by GitHub Actions — do not edit */\n"
          content += "window.APP_CONFIG = " + json.dumps(cfg, indent=2) + ";\n"

          with open("config.js", "w") as f:
              f.write(content)

          print("config.js written successfully")
          PY

      # ── Assemble deployment folder ──────────────────────────────────────────
      - name: Prepare dist/
        run: |
          mkdir -p dist
          cp index.html      dist/
          cp registration.js dist/
          cp config.js       dist/
          # Copy QR image only if it exists
          [ -f phonepe-qr.png ] && cp phonepe-qr.png dist/ || echo "phonepe-qr.png not found — skipping"

      # ── GitHub Pages deployment ─────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
